<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fútbol</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef2f7;
    }

    header {
      background: linear-gradient(135deg, #0b3fa0, #1e6ff2);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 30, 100, 0.3);
      border-bottom: 4px solid #ffd700;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1>Fútbol</h1>
  </header>
</body>
</html>
